name: Release

on:
  push:
    tags:
      - 'v*-mc1.20.1'

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches the project version
        shell: bash
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          expected="v${mod_version}-mc${minecraft_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi

  native-linux:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl-dev libgl-dev
      - name: Build Linux native
        run: bash forge/build_headless_gl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: common/src/main/resources/natives/libheadless_gl.so
          if-no-files-found: error

  native-windows:
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build Windows native
        shell: msys2 {0}
        run: |
          mkdir -p common/src/main/resources/natives
          gcc -shared -O2 -static -o common/src/main/resources/natives/libheadless_gl.dll forge/headless_gl_win.c -lopengl32 -lgdi32 -luser32
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: common/src/main/resources/natives/libheadless_gl.dll
          if-no-files-found: error

  build:
    needs: [native-linux, native-windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, fabric]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: natives-out
      - name: Install native libraries
        run: |
          mkdir -p common/src/main/resources/natives
          cp natives-out/native-linux/libheadless_gl.so common/src/main/resources/natives/
          cp natives-out/native-windows/libheadless_gl.dll common/src/main/resources/natives/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.loader }} JAR
        run: chmod +x gradlew && ./gradlew :${{ matrix.loader }}:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/retroconsole-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version metadata
        id: version
        run: |
          echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Collect JARs
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RetroConsole ${{ steps.version.outputs.mod_version }} (${{ steps.version.outputs.minecraft_version }})
          files: jars/retroconsole-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
