name: Build

on:
  push:
    branches: [master, main, 'mc/**']
  pull_request:
    branches: [master, main, 'mc/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y libegl-dev libgl-dev

      - name: Build Linux native from source
        run: bash neoforge/build_headless_gl.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod (both loaders)
        run: ./gradlew build verifyDistribution -Pfabric --no-daemon

      - name: Upload NeoForge JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: retroconsole-jar
          path: neoforge/build/libs/retroconsole-*.jar
          if-no-files-found: error

      - name: Upload Fabric JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: retroconsole-jar-fabric
          path: fabric/build/libs/retroconsole-*.jar
          if-no-files-found: error
