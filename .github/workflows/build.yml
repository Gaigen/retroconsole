name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y libegl-dev libgl-dev

      - name: Build Linux native from source
        run: bash build_headless_gl.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: retroconsole-jar
          path: build/libs/retroconsole-*.jar
          if-no-files-found: error
