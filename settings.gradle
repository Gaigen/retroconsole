pluginManagement {
 repositories { maven { url='https://maven.fabricmc.net/' }; maven { url='https://maven.minecraftforge.net/' }; gradlePluginPortal() }
}
// Both loader modules request a Java 17 toolchain, so let Gradle fetch one
// when the machine only has a newer JDK installed.
plugins {
 id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name='retroconsole'
include 'common', 'fabric', 'forge'
