pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'retroconsole'

include 'common'
include 'neoforge'

// Fabric is opt-in until it reaches parity: ./gradlew build -Pfabric
if (providers.gradleProperty('fabric').isPresent()) {
    include 'fabric'
}
