plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

// Loader-free code + resources shared by every loader: assets/, data/,
// pack.mcmeta and the bundled natives/.
//
// The loader projects compile these sources as part of their own source set
// (see the srcDir entries in neoforge/build.gradle), so this project on its own
// is a compile check: it catches code that names a loader API, which would then
// fail on the other loader. `grep -r net.neoforged common/src` must stay empty.
//
// The NeoForge dev classpath is only a Minecraft classpath provider here; the
// sources themselves only use vanilla classes and the facades in
// com.retroconsole.{network,server,client,config}.

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

dependencies {
    // compileOnly on purpose: these only have to be visible while compiling.
    // The loader module that ships the jar supplies them at runtime, and a second
    // copy on the run classpath makes FML abort with "Found multiple copies of
    // net/minecraft/server/MinecraftServer.class".
    compileOnly "net.neoforged:neoforge:${neo_version}"
    // JNA for loading native libretro cores (.so/.dll)
    compileOnly 'net.java.dev.jna:jna:5.17.0'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// This project never launches the game: the runs belong to the loader modules.
// NeoGradle still generates runClient/runServer/runData here, and a bare
// `./gradlew runClient` from the root directory matches every project that has
// the task, so :common:runClient would start a mod-less game (or die on the
// missing run directory) and take the build down with it before
// :neoforge:runClient ever runs.
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }
        .configureEach { enabled = false }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
