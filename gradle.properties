org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=retroconsole
mod_name=RetroConsole
mod_license=GPL-3.0-or-later
mod_version=0.3.1
mod_authors=Gaigen
mod_description=Retro console emulator in Minecraft

# This branch targets Minecraft 26.1.2 for All the Mods 11.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.1.3)
neo_version=26.1.2.124
neo_version_range=[26.1,)
# NeoForge 26.1.2.124 resolves FancyModLoader 11.0.15.
loader_version_range=[11,)

# Fabric side: same Minecraft and mappings, so common/ compiles unchanged.
# 26.x needs Java 25 and therefore a newer Gradle, which puts Loom on 1.19.x.
fabric_loom_version=1.19.3
fabric_loader_version=0.20.1
fabric_api_version=0.145.1+26.1
