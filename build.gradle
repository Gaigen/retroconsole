/*
 * Aggregator project — nothing is compiled here.
 *
 *   common/    loader-free code + assets/data/natives, shared by every loader
 *   neoforge/  NeoForge glue, run configs, native build, release jar
 *   fabric/    Fabric glue (opt-in via -Pfabric until it reaches parity)
 *
 * ./gradlew build            -> NeoForge jar only
 * ./gradlew build -Pfabric   -> both loaders
 */
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

allprojects {
    group = 'com.retroconsole'
    version = mod_version
}

tasks.register('modules') {
    group = 'help'
    description = 'List the subprojects that are part of this build.'
    doLast {
        subprojects.each { println " - ${it.path} (${it.projectDir.name})" }
    }
}
