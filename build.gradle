/*
 * Aggregator project — nothing is compiled here.
 *
 *   common/    loader-free code + assets/data/natives, shared by every loader
 *   neoforge/  NeoForge glue, run configs, native build, release jar
 *   fabric/    Fabric glue (opt-in via -Pfabric until it reaches parity)
 *
 * ./gradlew build            -> NeoForge jar only
 * ./gradlew build -Pfabric   -> both loaders
 */
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

allprojects {
    group = 'com.retroconsole'
    version = mod_version
}

tasks.register('modules') {
    group = 'help'
    description = 'List the subprojects that are part of this build.'
    doLast {
        subprojects.each { println " - ${it.path} (${it.projectDir.name})" }
    }
}

// A bare `./gradlew runClient` matches every project that owns the task, so the
// loader has to be named. These aliases are the short form; the long form is
// `./gradlew :neoforge:runClient` / `./gradlew :fabric:runClient -Pfabric`.
// They must not start with `run`: NeoGradle reads any run<X> task name as a
// request for a run of type <X> and fails with "run type 'x' was not found".
tasks.register('neoForgeClient') {
    group = 'runs'
    description = 'Start the NeoForge development client.'
    dependsOn ':neoforge:runClient'
}

tasks.register('fabricClient') {
    group = 'runs'
    description = 'Start the Fabric development client (needs -Pfabric).'
    if (providers.gradleProperty('fabric').isPresent()) {
        dependsOn ':fabric:runClient'
    } else {
        doFirst { throw new GradleException('Add -Pfabric to start the Fabric client.') }
    }
}

// Check the actual distribution jars, not just the development classpath.
tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verify loader metadata, shared classes, item resources and natives in the built jars.'
    def loaders = providers.gradleProperty('fabric').isPresent() ? ['neoforge', 'fabric'] : ['neoforge']
    dependsOn loaders.collect { ":${it}:jar" }
    doLast {
        loaders.each { loader ->
            def artifact = project(":${loader}").tasks.named('jar', Jar).get().archiveFile.get().asFile
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def required = [
                        'com/retroconsole/reg/ModBlockEntities.class',
                        'com/retroconsole/client/ScreenBlockEntityRenderer.class',
                        'com/retroconsole/bridge/LibretroCore.class',
                        'pack.mcmeta',
                        'assets/retroconsole/textures/block/retro_console_atlas.png',
                        'assets/retroconsole/blockstates/retro_console.json',
                        'natives/libheadless_gl.dll',
                        'natives/libheadless_gl.so'
                ]
                ['classic', 'compact', 'hifi', 'legacy', 'fullblock'].each { style ->
                    ['off', 'standby', 'running'].each { state ->
                        required.add("assets/retroconsole/models/block/console/${style}/${state}.json")
                    }
                }
                ['retro_console', 'screen', 'gamepad'].each { item ->
                    required.addAll([
                            "assets/retroconsole/items/${item}.json",
                            "assets/retroconsole/models/item/${item}.json",
                            "data/retroconsole/recipe/${item}.json"
                    ])
                }
                required.addAll(loader == 'fabric'
                        ? ['fabric.mod.json', 'retroconsole.mixins.json', 'retroconsole.classtweaker',
                           'com/retroconsole/fabric/RetroConsoleFabric.class']
                        : ['META-INF/neoforge.mods.toml', 'com/retroconsole/RetroConsole.class'])
                required.each { path ->
                    if (zip.getEntry(path.toString()) == null) {
                        throw new GradleException("${artifact.name} is missing ${path}")
                    }
                }
                def foreignMetadata = loader == 'fabric' ? 'META-INF/neoforge.mods.toml' : 'fabric.mod.json'
                if (zip.getEntry(foreignMetadata) != null) {
                    throw new GradleException("${artifact.name} contains ${foreignMetadata}")
                }
                if (loader == 'fabric') {
                    def metadata = zip.getInputStream(zip.getEntry('fabric.mod.json')).withCloseable {
                        new groovy.json.JsonSlurper().parse(it)
                    }
                    if (metadata.version != project.version.toString()
                            || metadata.accessWidener != 'retroconsole.classtweaker') {
                        throw new GradleException("${artifact.name} has invalid Fabric metadata")
                    }
                }
                logger.lifecycle("Verified ${artifact.name}: ${required.size()} required entries")
            }
        }
    }
}
